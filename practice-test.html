<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>JLPT N5 Practice Test</title>

    <!-- 1. VARIABLES -->
    <link rel="stylesheet" href="css/variables.css" />

    <!-- 2. GLOBAL STYLES -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- 3. SHARED COMPONENTS (NEW) -->
    <link rel="stylesheet" href="css/components.css" />

    <!-- 4. MODULE-SPECIFIC -->
    <link rel="stylesheet" href="css/practice-test.css" />

    <!-- 5. HELPERS -->
    <link rel="stylesheet" href="css/kana-helper.css" />
    <link rel="stylesheet" href="css/kanji-helper.css" />

    <!-- Global Search Styles (matching other pages) -->
    <style>
      /* Sticky header for practice test page */
      .practice-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 16px;
        background: #ffffff;
        border-bottom: 2px solid #e8e0d5;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .practice-header .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .practice-header .header-left h1 {
        margin: 0;
        font-size: 1.2rem;
      }
      .practice-header .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .practice-header .back-button {
        font-size: 0.8rem;
        background: #e8e0d5;
        padding: 4px 14px;
        border-radius: 40px;
        text-decoration: none;
        color: #2c3e2f;
        white-space: nowrap;
        transition: background 0.2s ease;
      }
      .practice-header .back-button:hover {
        background: #d4cbbc;
      }

      /* Compact control bar */
      .practice-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 8px 16px;
        background: #faf8f5;
        border-bottom: 1px solid #e8e0d5;
        min-height: 44px;
      }
      .practice-controls .control-group {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .practice-controls .control-group label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #4a6741;
      }
      .practice-controls .control-group select {
        padding: 4px 8px;
        border-radius: 40px;
        border: 1px solid #d4c9b8;
        font-size: 0.8rem;
        background: white;
        font-family: inherit;
      }
      .practice-controls .small-btn {
        font-size: 0.7rem;
        padding: 4px 10px;
        height: 26px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        background: #e8e0d5;
        color: #2c3e2f;
        transition: all 0.2s ease;
        font-family: inherit;
      }
      .practice-controls .small-btn:hover {
        transform: translateY(-1px);
        filter: brightness(0.95);
      }
      .practice-controls .progress-indicator {
        font-size: 0.8rem;
        color: #4a6741;
        margin-left: auto;
        white-space: nowrap;
      }
      .practice-controls .progress-indicator span {
        font-weight: 700;
        color: #6c8b6b;
      }

      @media (max-width: 700px) {
        .practice-header .header-left h1 {
          font-size: 1rem;
        }
        .practice-controls {
          gap: 4px 8px;
          padding: 6px 12px;
        }
        .practice-controls .control-group label {
          font-size: 0.7rem;
        }
        .practice-controls .control-group select {
          font-size: 0.7rem;
          padding: 3px 6px;
        }
        .practice-controls .small-btn {
          font-size: 0.65rem;
          padding: 3px 8px;
          height: 22px;
        }
        .practice-controls .progress-indicator {
          font-size: 0.7rem;
        }
      }
      @media (max-width: 480px) {
        .practice-header {
          flex-direction: column;
          align-items: stretch;
          gap: 4px;
        }
        .practice-header .header-left,
        .practice-header .header-right {
          width: 100%;
          justify-content: space-between;
        }
        .practice-header .header-left h1 {
          font-size: 0.9rem;
        }
        .practice-controls {
          flex-wrap: wrap;
          gap: 4px;
        }
        .practice-controls .control-group {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="practice-container">
      <!-- Header with consistent back button styling -->
      <div class="practice-header">
        <div class="header-left">
          <h1>📝 JLPT N5 Practice Test</h1>
        </div>
        <div class="header-right">
          <a href="index.html" class="back-button">← Back</a>
        </div>
      </div>

      <!-- Controls Bar -->
      <div class="practice-controls">
        <div class="control-group">
          <label>Section:</label>
          <select id="sectionSelect">
            <option value="all">Full Test (All Sections)</option>
            <option value="vocabulary">Vocabulary (文字・語彙)</option>
            <option value="grammar">Grammar (文法)</option>
            <option value="reading">Reading (読解)</option>
            <option value="listening">Listening (聴解)</option>
          </select>
        </div>
        <div class="control-group">
          <label>Questions:</label>
          <select id="quizCountSelect">
            <option value="5">5 questions</option>
            <option value="10" selected>10 questions</option>
            <option value="20">20 questions</option>
            <option value="50">50 questions</option>
          </select>
        </div>
        <div class="control-group">
          <label>Timer:</label>
          <button id="timerToggle" class="small-btn">⏱️ Timer Off</button>
        </div>
        <div class="control-group">
          <label>TTS:</label>
          <button id="ttsToggle" class="small-btn">🔊 TTS Off</button>
        </div>
        <div class="control-group">
          <button
            id="resetProgressBtn"
            class="small-btn"
            style="background: #dc3545; color: white"
          >
            🗑️ Reset Progress
          </button>
        </div>
        <div class="progress-indicator">
          <span id="masteredCount">0</span>/<span id="totalCount">0</span>
          mastered
        </div>
      </div>

      <!-- Timer Display -->
      <div id="timerDisplay" class="timer-display" style="display: none">
        ⏱️ Time: <span id="timerMinutes">00</span>:<span id="timerSeconds"
          >00</span
        >
      </div>

      <!-- Main Content -->
      <div class="practice-content">
        <!-- Quiz Area -->
        <div id="quizArea" class="quiz-area">
          <p class="quiz-welcome">
            Select section and number of questions, then click "Start Test"
          </p>
        </div>

        <!-- Start Button -->
        <div class="start-button-container">
          <button id="startQuizBtn" class="action-btn">▶ Start Test</button>
        </div>

        <!-- Results Area -->
        <div id="quizResults" class="results-area" style="display: none"></div>
      </div>
    </div>

    <script src="js/data/sprints.js"></script>
    <script src="js/data/sentences.js"></script>
    <script src="js/data/practiceTestData.js"></script>
    <script src="js/data/kanjiData.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/furigana.js"></script>
    <script src="js/utils/tooltips.js"></script>
    <script src="js/modules/audio.js"></script>
    <script src="js/modules/practiceTest.js"></script>
    <script src="js/utils/kanaHelper.js"></script>
    <script src="js/modules/kanji-stroke.js"></script>
    <script src="js/modules/kanji-helper.js"></script>
  </body>
</html>
